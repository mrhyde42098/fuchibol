services:
  - type: web
    name: fuchibol-api
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: STREAM_AUDIT_ENABLED
        value: "true"
      - key: FALLBACK_CHANNELS_PATH
        value: golea-analysis/channels.json
      - key: FALLBACK_AGENDA_PATH
        value: golea-analysis/agenda.json
